name: engcore-ci

on:
  push:
    paths:
      - "engcore/**"
      - ".github/workflows/engcore-ci.yml"
  pull_request:
    paths:
      - "engcore/**"
      - ".github/workflows/engcore-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engcore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests || true
      - name: Pytest
        run: python -m pytest -q
      - name: CLI smoke
        run: |
          engcore run --fixture unit-cube --confirm-units --units m --out /tmp/engcore-out
          test -f /tmp/engcore-out/quality_report.json
