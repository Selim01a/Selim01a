[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engcore"
version = "0.1.0"
description = "ENGINEERING//CORE M0 — offline-first structural mesh quality workstation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ENGINEERING//CORE" }]
dependencies = []

[project.optional-dependencies]
gmsh = ["gmsh>=4.12"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
engcore = "engcore.cli:main"
engcore-desktop = "engcore.desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engcore = ["data/fixtures/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
